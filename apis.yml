aid: georama
name: Georama
description: >-
  Georama is now QualSights (qualsights.com), a consumer-insights research
  technology company that helps brands understand human behavior across the
  product lifecycle. The platform combines Smart Sensors that passively capture
  product consumption and usage in real time, a participant app that collects
  video, photo, and survey feedback, and an AI-powered analytics layer that
  turns that data into actionable insights. Marquee offerings include UseSights
  (Physical AI for product usage), VoiceSights (AI-moderated conversations), and
  the moment-based XMOT feedback method, spanning opportunity identification,
  concept optimization, product development, pre-launch validation, market
  launch, and acceleration. Georama entered the API Evangelist network as a
  500 Global portfolio lead; QualSights publishes no public developer portal,
  API documentation, or SDKs at this time.
